openapi: 3.0.3
info:
  title: Stellar API
  description: |
    Stellar 後端 API 文件。
    目前僅涵蓋 events（生咖活動）、venues（場地）、artists（藝人）三個模組，
    其餘模組（auth、users、admin 等）尚未納入此文件。
  version: '1.0'
servers:
  - url: /api
    description: 相對於部署網域的 API base path

tags:
  - name: events
    description: 生咖活動
  - name: venues
    description: 場地
  - name: artists
    description: 藝人

paths:
  /events:
    get:
      tags: [events]
      summary: 取得活動列表（支援篩選、分頁）
      description: 未帶 status 篩選時，預設只回傳 status=approved 的活動。
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: artistId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [all, pending, approved, rejected] }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: createdBy
          description: 僅本人或 admin 可查詢他人的 createdBy
          schema: { type: string }
        - in: query
          name: startTimeFrom
          description: ISO 8601 字串（查詢參數走 URL，非 Firestore Timestamp 物件）
          schema: { type: string, format: date-time }
        - in: query
          name: startTimeTo
          description: ISO 8601 字串（查詢參數走 URL，非 Firestore Timestamp 物件）
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: sortBy
          schema: { type: string, enum: [title, startTime, createdAt] }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: checkFavorite
          description: true 且已登入時，回傳的每筆活動會附帶目前使用者的收藏狀態
          schema: { type: boolean }
      responses:
        '200':
          description: 活動列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/PublicEventListItem' }
                  total: { type: integer }
                  page: { type: integer }
    post:
      tags: [events]
      summary: 新增活動投稿
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventData' }
      responses:
        '201': { description: 建立成功 }
        '400':
          description: >-
            缺少必填欄位，或 reservation.startAt 有值但 reservation.url
            未填（錯誤訊息掛在 reservation.url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: 'title is required', code: VALIDATION_ERROR, field: title }

  /events/map-data:
    get:
      tags: [events]
      summary: 取得地圖用活動資料（輕量版）
      responses:
        '200':
          description: 地圖資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        slug: { type: string, nullable: true }
                        title: { type: string }
                        mainImage: { type: string }
                        location:
                          type: object
                          properties:
                            name: { type: string }
                            address: { type: string }
                            city: { type: string }
                            coordinates:
                              type: object
                              properties:
                                lat: { type: number }
                                lng: { type: number }
                        datetime: { $ref: '#/components/schemas/EventDatetimeIso' }
                        isFavorited: { type: boolean }
                  total: { type: integer }

  /events/search:
    get:
      tags: [events]
      summary: 搜尋活動
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: 搜尋結果

  /events/trending:
    get:
      tags: [events]
      summary: 熱門活動
      responses:
        '200':
          description: 熱門活動列表

  /events/{id}:
    get:
      tags: [events]
      summary: 取得單一活動詳情
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 活動詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoffeeEvent' }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Event not found', code: EVENT_NOT_FOUND }
    put:
      tags: [events]
      summary: 編輯活動
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventData' }
      responses:
        '200': { description: 更新後的活動 }
        '400':
          description: >-
            reservation.startAt 有值但 reservation.url 未填（錯誤訊息掛在
            reservation.url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                {
                  error: '請填寫預約網址，或清空預約日期／時間',
                  code: VALIDATION_ERROR,
                  field: reservation.url,
                }
        '403':
          description: 非本人投稿，也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足', code: EVENT_EDIT_FORBIDDEN }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在', code: EVENT_NOT_FOUND }
    delete:
      tags: [events]
      summary: 刪除活動
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 刪除成功 }
        '403':
          description: 非本人投稿，也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足', code: EVENT_DELETE_FORBIDDEN }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在', code: EVENT_NOT_FOUND }

  /events/{id}/view:
    post:
      tags: [events]
      summary: 紀錄一次瀏覽（有 rate limit）
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '204': { description: 紀錄成功（含去重命中） }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Event not found', code: EVENT_NOT_FOUND }
        '429':
          description: 超過 rate limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /events/{id}/resubmit:
    patch:
      tags: [events]
      summary: 重新送審（被拒絕後修改再送出）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 送審成功 }
        '403':
          description: 非本人投稿，只有創建者可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足: 只能重新送審自己的投稿', code: EVENT_RESUBMIT_FORBIDDEN }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在', code: EVENT_NOT_FOUND }
        '409':
          description: 活動目前狀態不是 rejected，只有被拒絕的活動可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '只能重新送審已拒絕的活動', code: EVENT_RESUBMIT_INVALID_STATE }

  /events/batch-review:
    post:
      tags: [events]
      summary: 批次審核活動（僅 admin）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [eventId, status]
                    properties:
                      eventId: { type: string }
                      status: { type: string, enum: [approved, rejected] }
                      reason:
                        type: string
                        description: 拒絕原因；status 為 rejected 時使用
      responses:
        '200':
          description: 審核完成
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CoffeeEvent' }
        '400':
          description: updates 為空、超過 50 筆，或元素缺少 eventId／status、status 不是合法值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                { error: 'updates 不能為空', code: VALIDATION_ERROR, field: updates }
        '404':
          description: 其中一筆活動不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在: abc123', code: EVENT_NOT_FOUND }
        '500':
          description: 批次審核失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Internal server error, code: INTERNAL_ERROR }

  /venues:
    get:
      tags: [venues]
      summary: 取得場地列表
      parameters:
        - in: query
          name: region
          description: >-
            單一地區可傳字串（?region=台北），多個地區則重複 key（?region=台北&region=新北）
            由 Express 解析為陣列；接受「臺」字形並正規化為「台」；不合法地區回 400。
          schema:
            oneOf:
              - $ref: '#/components/schemas/VenueRegion'
              - { type: array, items: { $ref: '#/components/schemas/VenueRegion' } }
        - in: query
          name: capacityRange
          schema: { type: string, enum: [20以下, 20-40, 40-60, 60以上] }
        - in: query
          name: search
          description: >-
            場地名稱模糊比對：去除名稱與關鍵字的空白/標點後轉小寫比對（substring），
            如 abcmart 會比對到 ABC Mart、scoups 會比對到 S.Coups。
            與 region/capacityRange 為交集；空字串或未帶時不套用。
          schema: { type: string }
        - in: query
          name: sort
          description: >-
            未帶時等同 composite（綜合排序：活躍週數 50% + 瀏覽數 30% + 新場地加分 20%，
            同分依 createdAt desc 再依 id asc 排序）。sort=eventCount 明確指定時維持既有的
            eventCount desc 排序，行為不變。sort=distance（距離最近）時 lat/lng 為必填，
            缺一即回 400；場地缺座標（lat/lng 缺值或兩者同時為 0）一律排在結果最後，
            距離相同或皆缺座標時比照 composite 的 tie-break 鏈排序。
          schema:
            {
              type: string,
              enum: [composite, eventCount, name, newest, random, distance],
              default: composite,
            }
        - in: query
          name: limit
          description: >-
            一般（非 random）查詢為每頁筆數，預設 20，不設上限；
            sort=random 時為必填的抽樣數量，且不套用 page。
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page
          description: >-
            僅用於一般（非 sort=random）查詢；非正整數（含缺少、0、負數、非數字字串）
            時 fallback 為 1，不報錯；超過 totalPages 時回傳空陣列。
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: lat
          description: >-
            使用者緯度，僅 sort=distance 時使用且為必填。sort=distance 時，空字串／
            純空白字串視同未帶 lat，回 400；sort 非 distance 時，lat（含空字串／
            純空白字串／任何值）一律被忽略，不報錯。
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: lng
          description: >-
            使用者經度，僅 sort=distance 時使用且為必填。sort=distance 時，空字串／
            純空白字串視同未帶 lng，回 400；sort 非 distance 時，lng（含空字串／
            純空白字串／任何值）一律被忽略，不報錯。
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: 場地列表
          content:
            application/json:
              schema:
                type: object
                required: [venues]
                properties:
                  venues:
                    type: array
                    items: { $ref: '#/components/schemas/Venue' }
                  pagination:
                    description: 僅一般（非 sort=random）查詢會回傳此欄位
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        '400':
          description: sort/limit 或 sort=distance 的 lat/lng 參數組合不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              examples:
                randomMissingLimit:
                  summary: sort=random 缺 limit
                  value:
                    {
                      error: 'limit is required when sort is "random"',
                      code: VALIDATION_ERROR,
                      field: limit,
                    }
                distanceMissingCoords:
                  summary: sort=distance 缺 lat/lng
                  value:
                    {
                      error: 'lat and lng are required when sort is "distance"',
                      code: VALIDATION_ERROR,
                      field: lat,
                    }
    post:
      tags: [venues]
      summary: 新增場地（僅 admin）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVenueData' }
      responses:
        '201': { description: 建立成功（status 為 pending） }

  /venues/tag-dictionary:
    get:
      tags: [venues]
      summary: 場地標籤字典（只回 active 標籤）
      description: |
        常數，部署時才會改。Response header `Cache-Control: public, max-age=3600`。
        Rate limit：每 IP 每 15 分鐘 180 次（額度同列表，但獨立計數）。
      responses:
        '200':
          description: 標籤分組與標籤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueTagDictionary' }

  /venues/admin/{id}:
    get:
      tags: [venues]
      summary: 取得場地詳情（僅 admin，含非 active 場地、原始標籤與 calendarUrl）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 場地詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminVenueDetail' }
        '404': { description: 場地不存在 }

  /venues/{id}:
    get:
      tags: [venues]
      summary: 取得單一場地詳情（含關聯活動）
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 場地詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
    patch:
      tags: [venues]
      summary: 編輯場地（僅 admin）
      description: 沒帶的欄位不動；有帶的 `tags`、`sourceLinks`、`hostTags`、`otherPhotos` 整個覆蓋。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVenueData' }
      responses:
        '200': { description: 更新成功 }
        '400':
          description: 輸入格式錯誤（例如標籤不在字典裡、slug 重複）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    delete:
      tags: [venues]
      summary: 刪除場地（僅 admin）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 刪除成功 }

  /venues/{id}/view:
    post:
      tags: [venues]
      summary: 紀錄一次瀏覽（有 rate limit）
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '204': { description: 紀錄成功（含去重命中） }
        '404':
          description: 找不到場地
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Venue not found', code: VENUE_NOT_FOUND }
        '429':
          description: 超過 rate limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venues/admin/{id}/place-reselect/preview:
    post:
      tags: [venues]
      summary: 預覽場地重新選擇地點（僅 admin，唯讀）
      description: >-
        後端以 placeId 向 Google 查座標與地址，回傳預覽，不寫入任何資料。
        Rate limit：30 req / 15min（與 apply 共用）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenuePlaceReselectRequest' }
      responses:
        '200':
          description: 預覽結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenuePlaceReselectPreview' }
        '400':
          description: placeId 格式不合（VALIDATION_ERROR，field 為 placeId）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '401': { description: 未登入 }
        '403':
          description: 非管理員
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Admin access required, code: ADMIN_REQUIRED }
        '404':
          description: 場地不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Venue not found, code: VENUE_NOT_FOUND }
        '409':
          description: 新 placeId 已被其他場地使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: Place ID is already used by another venue
                code: PLACE_ID_IN_USE
                details: { venue: { id: venue-2, name: 某某咖啡 } }
        '422':
          description: >-
            Google 查詢失敗（PLACE_LOOKUP_FAILED）、Google 無座標（PLACE_NO_COORDINATES），
            或候選活動超過 400 筆（TOO_MANY_LINKABLE_EVENTS，details.linkableEventCount 為實際總數）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: Too many linkable events
                code: TOO_MANY_LINKABLE_EVENTS
                details: { linkableEventCount: 523 }
        '429': { description: 超過 rate limit }
        '503': { description: Google API key 未設定（SERVICE_UNAVAILABLE） }

  /venues/admin/{id}/place-reselect:
    post:
      tags: [venues]
      summary: 套用場地重新選擇地點（僅 admin）
      description: >-
        單一 transaction 內更新場地 placeId、座標（必要時地址），並補連 approved、
        location.placeId 相同、venueId 為空的活動。以 transaction 內讀到的資料為準，回傳實際補連結果。
        Rate limit：30 req / 15min（與 preview 共用）。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenuePlaceReselectRequest' }
      responses:
        '200':
          description: 套用成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenuePlaceReselectResult' }
        '400':
          description: >-
            placeId 或 addressChoice 格式不合（VALIDATION_ERROR），或地址不同卻未帶
            addressChoice（ADDRESS_CHOICE_REQUIRED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: Address choice is required
                code: ADDRESS_CHOICE_REQUIRED
                field: addressChoice
        '401': { description: 未登入 }
        '403':
          description: 非管理員
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Admin access required, code: ADMIN_REQUIRED }
        '404':
          description: 場地不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Venue not found, code: VENUE_NOT_FOUND }
        '409':
          description: 新 placeId 已被其他場地使用（transaction 內再檢查）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: Place ID is already used by another venue
                code: PLACE_ID_IN_USE
                details: { venue: { id: venue-2, name: 某某咖啡 } }
        '422':
          description: >-
            PLACE_LOOKUP_FAILED、PLACE_NO_COORDINATES，或 transaction 內候選活動超過 400 筆
            （TOO_MANY_LINKABLE_EVENTS）；皆不寫入任何資料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { description: 超過 rate limit }
        '503': { description: Google API key 未設定（SERVICE_UNAVAILABLE） }

  /venues/batch-review:
    patch:
      tags: [venues]
      summary: 批次審核場地（僅 admin，最多 50 筆）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                updates:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      venueId: { type: string }
                      status: { type: string, enum: [active, rejected] }
      responses:
        '200': { description: 審核完成 }

  /venues/batch-status:
    patch:
      tags: [venues]
      summary: 批次更新場地狀態（僅 admin，最多 50 筆）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 更新完成 }

  /venue-submissions:
    post:
      tags: [venues]
      summary: 公開場地投稿（建立為 pending）
      description: 不接受 STELLAR 代貼的正式欄位（tags、sourceLinks、equipmentNote、infoUpdatedOn、calendarUrl），帶了會被靜默丟掉。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVenueSubmissionData' }
      responses:
        '201':
          description: 投稿建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
        '400':
          description: 輸入格式錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '場地名稱不能為空', code: VALIDATION_ERROR, field: name }
        '429':
          description: 每 IP 每 60 分鐘最多 5 次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venue-submissions/images:
    post:
      tags: [venues]
      summary: 公開場地投稿圖片上傳
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG、PNG 或 WebP，最大 5MB
      responses:
        '200': { description: 上傳成功 }
        '400':
          description: 格式、大小或欄位錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '圖片大小不能超過 5MB', code: VALIDATION_ERROR, field: file }
        '429':
          description: 每 IP 每 15 分鐘最多 60 次成功上傳
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venue-submissions/places/autocomplete:
    post:
      tags: [venues]
      summary: 公開場地投稿 Places 搜尋
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string }
      responses:
        '200': { description: Places 預測結果 }
        '429':
          description: 每 IP 每 15 分鐘最多 300 次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venue-submissions/places/{placeId}:
    get:
      tags: [venues]
      summary: 公開場地投稿 Place detail
      parameters:
        - name: placeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Place detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  geometry:
                    type: object
                    properties:
                      location:
                        type: object
                        properties:
                          lat: { type: number }
                          lng: { type: number }
                  formatted_address: { type: string }
                  name: { type: string }
                  city: { type: string }
                  types:
                    type: array
                    items: { type: string }
                    description: Google place types；Google 沒回時為 []。含 establishment 代表選到店家而不是地址
        '429':
          description: 每 IP 每 15 分鐘最多 300 次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /artists:
    get:
      tags: [artists]
      summary: 取得藝人列表
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [approved, pending, rejected] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: sortBy
          schema: { type: string, enum: [stageName, coffeeEventCount, createdAt, birthday] }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: 藝人列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artist' }
        '403':
          description: 帶 createdBy 查詢他人投稿，且非本人也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Permission denied', code: FORBIDDEN }
    post:
      tags: [artists]
      summary: 新增藝人投稿
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArtistData' }
      responses:
        '201': { description: 建立成功 }
        '400':
          description: 缺少必填欄位或格式錯誤（見 artistSchemas.create）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '藝名為必填欄位', code: VALIDATION_ERROR, field: stageName }

  /artists/top:
    get:
      tags: [artists]
      summary: 熱門藝人排行
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: 熱門藝人列表 }
        '400':
          description: limit 非數字或小於 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: 'Invalid limit parameter', code: VALIDATION_ERROR, field: limit }

  /artists/{id}:
    get:
      tags: [artists]
      summary: 取得單一藝人詳情
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 藝人詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Artist not found', code: ARTIST_NOT_FOUND }
    put:
      tags: [artists]
      summary: 編輯藝人資料
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 更新成功 }
        '400':
          description: 格式錯誤（見 artistSchemas.update，所有欄位皆為 optional）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '生日格式錯誤', code: VALIDATION_ERROR, field: birthday }
        '403':
          description: 非本人投稿也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足', code: ARTIST_EDIT_FORBIDDEN }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在', code: ARTIST_NOT_FOUND }
    delete:
      tags: [artists]
      summary: 刪除藝人（僅 admin）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 刪除成功 }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在', code: ARTIST_NOT_FOUND }
        '409':
          description: 該藝人仍有關聯的生咖活動，不能刪除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '不能刪除已經有生咖活動的藝人', code: ARTIST_HAS_EVENTS }

  /artists/{id}/resubmit:
    patch:
      tags: [artists]
      summary: 重新送審
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 送審成功 }
        '403':
          description: 非本人投稿，只有創建者可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足: 只能重新送審自己的投稿', code: ARTIST_RESUBMIT_FORBIDDEN }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在', code: ARTIST_NOT_FOUND }
        '409':
          description: 藝人目前狀態不是 rejected，只有被拒絕的藝人可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { error: '只能重新送審已拒絕的藝人', code: ARTIST_RESUBMIT_INVALID_STATE }

  /artists/batch-review:
    post:
      tags: [artists]
      summary: 批次審核藝人（僅 admin）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [artistId, status]
                    properties:
                      artistId: { type: string }
                      status: { type: string, enum: [approved, rejected, exists] }
                      reason:
                        type: string
                        description: 拒絕原因；status 為 rejected 時使用
                      groupNames:
                        type: array
                        items: { type: string }
                        description: 審核通過時可一併更新團名
      responses:
        '200':
          description: 審核完成
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artist' }
        '400':
          description: updates 為空、超過 50 筆，或元素缺少 artistId／status、status 不是合法值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                { error: 'updates 不能為空', code: VALIDATION_ERROR, field: updates }
        '404':
          description: 其中一筆藝人不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在: abc123', code: ARTIST_NOT_FOUND }
        '500':
          description: 批次審核失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Internal server error, code: INTERNAL_ERROR }

components:
  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Firebase ID Token，帶在 `Authorization: Bearer {token}`'

  schemas:
    Error:
      type: object
      description: >-
        統一錯誤回應格式（見 src/utils/AppError.ts 與全域錯誤處理 middleware）。
      required: [error, code]
      properties:
        error: { type: string, description: 人類可讀的錯誤訊息 }
        code:
          type: string
          description: >-
            機器可讀的錯誤代碼，例如 EVENT_NOT_FOUND、ARTIST_NOT_FOUND、VENUE_NOT_FOUND、
            FORBIDDEN、VALIDATION_ERROR、SERVICE_UNAVAILABLE、RATE_LIMITED、
            ROUTE_NOT_FOUND、INTERNAL_ERROR 等，實際值請以拋出的 AppError 為準。
        details:
          description: >-
            選用的結構化補充資料（optional，僅部分錯誤帶，例如 PLACE_ID_IN_USE 的
            details.venue、TOO_MANY_LINKABLE_EVENTS 的 details.linkableEventCount）。

    ValidationError:
      description: VALIDATION_ERROR 的回應（400），部分情境會額外帶 field。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            field:
              type: string
              description: 驗證失敗的欄位名稱（optional，並非所有 VALIDATION_ERROR 都會帶此欄位）

    LinkableEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }

    VenuePlaceReselectRequest:
      type: object
      required: [placeId]
      properties:
        placeId:
          type: string
          pattern: '^[A-Za-z0-9_-]{10,300}$'
        addressChoice:
          type: string
          enum: [existing, google]
          description: 僅在 preview 的 address.choiceRequired 為 true 時必填，其餘情況忽略

    VenuePlaceReselectPreview:
      type: object
      properties:
        placeId: { type: string }
        unchanged: { type: boolean, description: 新 placeId 等於場地現有 placeId }
        google:
          type: object
          properties:
            formattedAddress: { type: string }
            lat: { type: number }
            lng: { type: number }
            isAddressType: { type: boolean, description: placeId 非 ChIJ 開頭（僅提醒，不擋） }
            types: { type: array, items: { type: string } }
        address:
          type: object
          properties:
            current: { type: string }
            google: { type: string }
            sameAfterNormalize: { type: boolean }
            choiceRequired:
              type: boolean
              description: 地址正規化後不同、現有地址非空且 Google 地址非空時為 true；Google 地址為空時一律保留現有地址
        linkableEvents:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/LinkableEvent' }
        linkableEventCount:
          type: integer
          description: 實際候選總數（成功回應時必 <= 400，名單可能少於總數）

    VenuePlaceReselectResult:
      type: object
      properties:
        venueId: { type: string }
        placeId: { type: string }
        lat: { type: number }
        lng: { type: number }
        address: { type: string }
        linkedEvents:
          type: array
          items: { $ref: '#/components/schemas/LinkableEvent' }
        linkedCount: { type: integer }

    FirestoreTimestamp:
      type: object
      description: >-
        Firestore Timestamp 物件（非 ISO 字串）。多數 events 端點（詳情、建立、更新、搜尋、熱門、
        收藏）一律是這個形狀；例外見 EventDatetimeIso。
      required: [_seconds, _nanoseconds]
      properties:
        _seconds: { type: integer }
        _nanoseconds: { type: integer }

    EventDatetimeIso:
      type: object
      description: >-
        ISO 8601 字串形式的 datetime（非 FirestoreTimestamp）。僅 GET /events 與
        GET /events/map-data 這兩個列表端點的回應使用此格式；其餘 events 端點仍回傳
        FirestoreTimestamp。GET /events 不論帶什麼 status（approved/pending/rejected/all）
        或 createdBy 查詢參數，datetime 一律是這個格式，並非只有公開（approved）列表才如此。
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    CoffeeEvent:
      type: object
      properties:
        id: { type: string }
        slug: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        artists:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              profileImage: { type: string }
        location:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
            venueId: { type: string }
        datetime:
          type: object
          properties:
            start: { $ref: '#/components/schemas/FirestoreTimestamp' }
            end: { $ref: '#/components/schemas/FirestoreTimestamp' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          description: 選填。舊活動（投稿於此欄位上線前）沒有此欄位，前端視為未填寫即可。
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectedReason: { type: string }
        viewCount: { type: integer }

    PublicEventListItem:
      type: object
      description: >-
        GET /events 回應中的活動項目。欄位與 CoffeeEvent 相同，但 datetime 為 EventDatetimeIso
        （ISO 8601 字串），不是 FirestoreTimestamp；不論查詢帶的 status（approved/pending/
        rejected/all）或 createdBy 為何皆是如此，不限於公開（approved）列表。
        不繼承 CoffeeEvent（allOf 疊加無法正確覆寫 datetime 的形狀——CoffeeEvent.datetime
        要求 FirestoreTimestamp，會與這裡的 EventDatetimeIso 互斥而永遠驗證失敗），改為完整
        重新定義。
      properties:
        id: { type: string }
        slug: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        artists:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              profileImage: { type: string }
        location:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
            venueId: { type: string }
        datetime: { $ref: '#/components/schemas/EventDatetimeIso' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          description: 選填。舊活動（投稿於此欄位上線前）沒有此欄位，前端視為未填寫即可。
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectedReason: { type: string }
        viewCount: { type: integer }

    CreateEventData:
      type: object
      required: [artistIds, title, location, datetime]
      properties:
        artistIds: { type: array, items: { type: string } }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location:
          type: object
          required: [name, coordinates]
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
        datetime:
          type: object
          properties:
            start: { $ref: '#/components/schemas/FirestoreTimestamp' }
            end: { $ref: '#/components/schemas/FirestoreTimestamp' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          description: '選填。url 需以 http:// 或 https:// 開頭；startAt 有值時 url 必填（否則 400）。'
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }

    UpdateEventData:
      type: object
      description: >-
        欄位與 CreateEventData 相同但皆為選填（局部更新，未傳入的欄位不變動既有值）。
        不繼承 CreateEventData（allOf 疊加覆寫在部分 validator 下無法正確表達
        reservation 的 nullable 語意），改為完整重新定義。
      properties:
        artistIds: { type: array, items: { type: string } }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location:
          type: object
          required: [name, coordinates]
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
        datetime:
          type: object
          properties:
            start: { $ref: '#/components/schemas/FirestoreTimestamp' }
            end: { $ref: '#/components/schemas/FirestoreTimestamp' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          nullable: true
          description: 傳入 null 或 {} 代表清除既有預約資訊；省略此欄位則不變動既有值。
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }

    VenueRegion:
      type: string
      enum:
        [
          台北,
          新北,
          桃園,
          台中,
          台南,
          高雄,
          基隆,
          新竹,
          嘉義,
          宜蘭,
          苗栗,
          彰化,
          南投,
          雲林,
          屏東,
          花蓮,
          台東,
          澎湖,
          金門,
          連江,
        ]
      description: 與 src/middleware/validation.ts 的 venueRegionEnum 一致；「臺」字形會先正規化為「台」再比對。

    Venue:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        region: { $ref: '#/components/schemas/VenueRegion' }
        lat: { type: number }
        lng: { type: number }
        nearestMrt: { type: string }
        mrtWalkMinutes: { type: integer, nullable: true }
        capacityRange: { type: string, nullable: true }
        eventCount: { type: integer }
        viewCount: { type: integer }
        coverPhoto: { type: string }
        otherPhotos: { type: array, items: { type: string } }
        description: { type: string }
        hostTags:
          type: array
          items: { type: string }
          deprecated: true
          description: 前台不再顯示；資料保留，寫入仍接受
        tags:
          type: array
          description: 已過濾過期與停用的標籤；沒有標籤時為 []
          items: { $ref: '#/components/schemas/VenueTag' }
        status: { type: string }
        socialMedia:
          type: object
          properties:
            threads: { type: string }
            instagram: { type: string }
            line: { type: string }

    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/Venue'
        - type: object
          properties:
            sourceLinks: { type: array, maxItems: 5, items: { type: string, format: uri } }
            equipmentNote: { type: string, description: 店家提供的設備原文，空字串代表沒有 }
            infoUpdatedOn: { type: string, format: date, nullable: true }
            bookingFormUrl: { type: string, format: uri, nullable: true, description: 預約表單網址；沒有時為 null，key 一定存在 }
            transitStops:
              type: array
              nullable: true
              maxItems: 5
              items: { $ref: '#/components/schemas/TransitStop' }
              description: 交通方式，照存的順序。null＝舊場地從沒用過這個欄位（請退回讀 nearestMrt、mrtWalkMinutes）；[]＝管理員清空過。公開列表不回傳
            events:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  artistName: { type: string }
                  startDate: { type: string }
                  endDate: { type: string }
                  coverImage: { type: string }
                  slug: { type: string, nullable: true }
                  timeStatus:
                    type: string
                    nullable: true
                    enum: [ongoing, upcoming, ended, null]
                    description: 依台灣時間的今天計算；沒有開始或結束日時為 null

    AdminVenueDetail:
      description: VenueDetail 加上 calendarUrl 與 submission；tags 為原始資料，含過期與停用的標籤
      allOf:
        - $ref: '#/components/schemas/VenueDetail'
        - type: object
          properties:
            calendarUrl: { type: string, format: uri, nullable: true }
            submission:
              $ref: '#/components/schemas/VenueSubmissionRecord'

    VenueSubmissionRecord:
      type: object
      description: 店家投稿時的問卷與建議（只有 admin 詳情回傳；舊場地、後台新增的場地沒有這個 key）。confirmedAt 為 null＝還沒確認
      required: [submittedAt, answers, suggestedTags, confirmedAt]
      properties:
        submittedAt: { $ref: '#/components/schemas/FirestoreTimestamp' }
        answers:
          allOf:
            - $ref: '#/components/schemas/VenueConditionAnswers'
          description: 驗證後的問卷答案，不含 calendarUrl（只存在正式欄位 calendarUrl）
        suggestedTags:
          type: array
          description: 投稿當下算出的建議快照，之後改交通欄位不會跟著變
          items:
            allOf:
              - $ref: '#/components/schemas/VenueTag'
              - type: object
                required: [source]
                properties:
                  source: { type: string, enum: [store, auto], description: store＝店家勾的；auto＝自動帶入（可佈置、近捷運、近火車站） }
        confirmedAt:
          allOf:
            - $ref: '#/components/schemas/FirestoreTimestamp'
          nullable: true

    VenueConditionAnswers:
      type: object
      description: >-
        店家問卷（A–E、補充、F、G）。A 沒勾 can_decorate 時 fees 會被丟掉、不回 400；
        A、C 至少一個選項或 discussable: true；A 勾 can_decorate 時 B 至少答一題或 discussable: true；
        D 至少一個選項（discussable 會被丟掉）。選項重複不報錯。舊的 other、otherEquipment 會被丟掉。
        fees、equipment 為 null 視為沒答
      required: [uses, services, spaceTypes]
      properties:
        uses:
          type: object
          properties:
            options:
              type: array
              items: { type: string, enum: [goods_distribution, can_decorate, private_booking] }
            discussable: { type: boolean }
        fees:
          type: object
          description: B 佈置、辦生咖的費用；只在 uses.options 含 can_decorate 時有意義
          properties:
            venueFee: { type: string, enum: [free, paid, depends] }
            freeVenueLimited: { type: boolean, description: venueFee 不是 free 時被丟掉 }
            freeVenueUntil:
              type: string
              format: date
              nullable: true
              description: venueFee 不是 free 時被丟掉；''、只有空白、null 視為沒填；有日期就視為限期（存成 freeVenueLimited true）；不能早於台灣時間的今天
            guarantee: { type: string, enum: ['yes', 'no'] }
            deposit: { type: string, enum: ['yes', 'no'] }
            discussable: { type: boolean }
        services:
          type: object
          properties:
            options:
              type: array
              items: { type: string, enum: [parcel_receiving, early_setup, custom_menu, beginner_friendly] }
            discussable: { type: boolean }
        spaceTypes:
          type: object
          required: [options]
          properties:
            options:
              type: array
              minItems: 1
              items: { type: string, enum: [cafe, exhibition_space, bar, multi_space, takeaway_shop] }
        equipment:
          type: array
          items: { type: string, enum: [projector, sound_system, display_fixtures] }
        note: { type: string, maxLength: 1000, description: 「還有什麼想讓主辦知道的？」；trim 後空白視為沒填（不存這個 key）；不變成標籤 }
        sourceLinks:
          type: array
          description: F 原始說明連結，規則同 VenueTagFields.sourceLinks；只存在 submission，等管理員確認
          items: { type: string, maxLength: 500 }
        calendarUrl:
          type: string
          nullable: true
          maxLength: 500
          description: G 檔期行事曆連結（http/https）；投稿時直接寫進正式欄位 calendarUrl（不公開、不需確認），不存進 submission.answers

    TransitStop:
      type: object
      required: [type, station, walkMinutes]
      properties:
        type: { type: string, enum: [mrt, light_rail, train, hsr, bus], description: 捷運／輕軌／火車站／高鐵／公車站 }
        station: { type: string, minLength: 1, maxLength: 100, description: 前後空白會 trim }
        walkMinutes: { type: integer, minimum: 0, maximum: 999, nullable: true, description: 寫入時沒帶或送 '' 存成 null }

    TransitStopsInput:
      type: array
      maxItems: 5
      description: >-
        交通方式，存放順序＝送的順序。整列空白（沒有 type、station 空白、沒有 walkMinutes）先丟掉才算列數；
        只有類型或只有站名回 400。有帶就整個覆蓋，並在同一次寫入回寫 nearestMrt、mrtWalkMinutes
        （類型優先序 mrt → light_rail → train → hsr → bus，同類型取陣列最前面那筆；非捷運的站名前加
        輕軌／火車／高鐵／公車，站名已含類型字就不加；超過 100 字截到 100 字），body 裡的 nearestMrt、mrtWalkMinutes 會被忽略。
        丟掉空白列後是 [] 時兩個舊欄位清成 '' 與 null
      items: { $ref: '#/components/schemas/TransitStop' }

    VenueTag:
      type: object
      required: [slug]
      description: 不限期 `{slug}`；限期沒日期 `{slug, limited}`；限期到某天 `{slug, limited, until}`（until 當天仍顯示）
      properties:
        slug: { type: string }
        limited: { type: boolean, enum: [true] }
        until: { type: string, format: date, description: 台灣時間的日期，有 until 一定要有 limited }

    VenueTagInput:
      type: object
      required: [slug]
      description: 寫入用；`limited:false` 視為不限期、存檔時拿掉。有 until 一定要 limited:true。until 可以是過去日期
      properties:
        slug: { type: string }
        limited: { type: boolean }
        until: { type: string, format: date }

    VenueTagDictionary:
      type: object
      properties:
        groups:
          type: array
          items:
            type: object
            properties:
              key: { type: string, enum: [price, service, transport, space, equipment] }
              label: { type: string }
              order: { type: integer }
        tags:
          type: array
          items:
            type: object
            required: [slug, group, label, order]
            properties:
              slug: { type: string }
              group: { type: string }
              label: { type: string }
              order: { type: integer, description: 組內順序 }
              cardRank:
                type: integer
                description: 有值才能上卡片，數字小的優先

    VenueTagFields:
      type: object
      properties:
        tags:
          type: array
          description: slug 要在字典裡且 active、不能重複
          items: { $ref: '#/components/schemas/VenueTagInput' }
        sourceLinks:
          type: array
          description: http/https，各 500 字以內；空字串（含只有空白）先濾掉，濾掉後最多 5 個
          items: { type: string, maxLength: 500 }
        equipmentNote: { type: string, maxLength: 1000 }
        infoUpdatedOn: { type: string, format: date, nullable: true }
        calendarUrl:
          type: string
          nullable: true
          maxLength: 500
          description: http/https 網址；`''` 或 null 視為清空（存成 null）；只有 admin 看得到

    UpdateVenueData:
      allOf:
        - type: object
          properties:
            name: { type: string, maxLength: 200 }
            address: { type: string, maxLength: 500 }
            region: { type: string }
            status: { type: string, enum: [active, inactive] }
            nearestMrt: { type: string }
            mrtWalkMinutes: { type: integer, nullable: true }
            capacityRange:
              { type: string, nullable: true, enum: [20以下, 20-40, 40-60, 60以上, null] }
            description: { type: string }
            hostTags: { type: array, items: { type: string } }
            preferredContact: { type: string, enum: [instagram, threads, line, form, other], description: 新前端只送 instagram／threads／line；form、other 為舊資料相容 }
            contactUrl: { type: string, format: uri, description: LINE 連結（舊資料可能是表單網址） }
            bookingFormUrl: { type: string, format: uri, maxLength: 500, nullable: true, description: 預約表單網址（私訊按鈕下的次要連結）；http/https、500 字內。清空送 null（後端也把空字串當清空） }
            transitStops:
              allOf:
                - $ref: '#/components/schemas/TransitStopsInput'
              nullable: true
              description: 沒帶不動；[] 或 null＝清空，兩種都存成 []
            confirmSuggestions:
              type: boolean
              description: true＝這次存檔同時確認店家建議（場地有 submission 且 confirmedAt 為 null 時寫入 submission.confirmedAt，其他情況忽略、不回錯誤）。不會存成欄位
            coverPhoto: { type: string, format: uri }
            otherPhotos: { type: array, items: { type: string, format: uri } }
            socialMedia:
              type: object
              properties:
                threads: { type: string }
                instagram: { type: string }
                line: { type: string }
        - $ref: '#/components/schemas/VenueTagFields'

    CreateVenueData:
      description: admin 新增；可直接寫入正式標籤欄位。venueConditions 只在 /venue-submissions 有效，admin 新增帶了會被丟掉
      allOf:
        - $ref: '#/components/schemas/CreateVenueSubmissionData'
        - $ref: '#/components/schemas/VenueTagFields'

    CreateVenueSubmissionData:
      type: object
      required: [name, address, region, capacityRange, coverPhoto, preferredContact, socialMedia]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        region: { type: string }
        lat: { type: number }
        lng: { type: number }
        placeId: { type: string }
        nearestMrt: { type: string }
        mrtWalkMinutes: { type: integer, nullable: true }
        capacityRange: { type: string, enum: [20以下, 20-40, 40-60, 60以上] }
        description: { type: string }
        hostTags: { type: array, maxItems: 5, items: { type: string } }
        preferredContact: { type: string, enum: [instagram, threads, line, form, other], description: 新前端只送 instagram／threads／line；form、other 為舊資料相容 }
        contactUrl: { type: string, format: uri, description: LINE 連結（舊資料可能是表單網址） }
        bookingFormUrl: { type: string, format: uri, maxLength: 500, nullable: true, description: 預約表單網址（私訊按鈕下的次要連結）；http/https、500 字內。清空送 null（後端也把空字串當清空） }
        transitStops:
          allOf:
            - $ref: '#/components/schemas/TransitStopsInput'
          nullable: true
          description: 選填；直接寫正式欄位（不進 submission）。沒帶或 null 時不寫這個 key，nearestMrt、mrtWalkMinutes 照送的值存
        coverPhoto: { type: string, format: uri }
        otherPhotos: { type: array, maxItems: 9, items: { type: string, format: uri } }
        socialMedia:
          type: object
          description: Instagram 或 Threads 至少一個非空；Line 可保留但不能單獨滿足建立條件
          anyOf:
            - required: [instagram]
            - required: [threads]
          properties:
            threads: { type: string, minLength: 1 }
            instagram: { type: string, minLength: 1 }
            line: { type: string }
        venueConditions:
          allOf:
            - $ref: '#/components/schemas/VenueConditionAnswers'
          description: 選填（舊表單不送）。只在 /venue-submissions 有效：存成 submission（confirmedAt null）等管理員確認，正式 tags、sourceLinks、equipmentNote 一律留空；calendarUrl 直接寫正式欄位。回應不含 submission

    Artist:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        stageName: { type: string }
        stageNameZh: { type: string }
        groupNames: { type: array, items: { type: string }, maxItems: 5 }
        realName: { type: string }
        birthday: { type: string, format: date }
        profileImage: { type: string }
        status: { type: string, enum: [pending, approved, rejected, exists] }
        rejectedReason: { type: string }
        activeEventIds: { type: array, items: { type: string } }

    CreateArtistData:
      type: object
      required: [stageName]
      properties:
        stageName: { type: string, maxLength: 100 }
        stageNameZh: { type: string, maxLength: 100 }
        groupNames: { type: array, items: { type: string }, maxItems: 5 }
        realName: { type: string, maxLength: 100 }
        birthday:
          {
            type: string,
            pattern: '^\d{4}-\d{2}-\d{2}$',
            description: '格式正確但日曆上不存在的日期（如 2026-02-31）會回 400「生日日期不存在」',
          }
        profileImage: { type: string, format: uri }
