openapi: 3.0.3
info:
  title: Stellar API
  description: |
    Stellar 後端 API 文件。
    目前僅涵蓋 events（生咖活動）、venues（場地）、artists（藝人）三個模組，
    其餘模組（auth、users、admin 等）尚未納入此文件。
  version: '1.0'
servers:
  - url: /api
    description: 相對於部署網域的 API base path

tags:
  - name: events
    description: 生咖活動
  - name: venues
    description: 場地
  - name: artists
    description: 藝人

paths:
  /events:
    get:
      tags: [events]
      summary: 取得活動列表（支援篩選、分頁）
      description: 未帶 status 篩選時，預設只回傳 status=approved 的活動。
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: artistId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [all, pending, approved, rejected] }
        - in: query
          name: region
          schema: { type: string }
        - in: query
          name: createdBy
          description: 僅本人或 admin 可查詢他人的 createdBy
          schema: { type: string }
        - in: query
          name: startTimeFrom
          description: ISO 8601 字串（查詢參數走 URL，非 Firestore Timestamp 物件）
          schema: { type: string, format: date-time }
        - in: query
          name: startTimeTo
          description: ISO 8601 字串（查詢參數走 URL，非 Firestore Timestamp 物件）
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: sortBy
          schema: { type: string, enum: [title, startTime, createdAt] }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: checkFavorite
          description: true 且已登入時，回傳的每筆活動會附帶目前使用者的收藏狀態
          schema: { type: boolean }
      responses:
        '200':
          description: 活動列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/PublicEventListItem' }
                  total: { type: integer }
                  page: { type: integer }
    post:
      tags: [events]
      summary: 新增活動投稿
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventData' }
      responses:
        '201': { description: 建立成功 }
        '400':
          description: >-
            缺少必填欄位，或 reservation.startAt 有值但 reservation.url
            未填（錯誤訊息掛在 reservation.url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: 'title is required', code: VALIDATION_ERROR, field: title }

  /events/map-data:
    get:
      tags: [events]
      summary: 取得地圖用活動資料（輕量版）
      responses:
        '200':
          description: 地圖資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        slug: { type: string, nullable: true }
                        title: { type: string }
                        mainImage: { type: string }
                        location:
                          type: object
                          properties:
                            name: { type: string }
                            address: { type: string }
                            city: { type: string }
                            coordinates:
                              type: object
                              properties:
                                lat: { type: number }
                                lng: { type: number }
                        datetime: { $ref: '#/components/schemas/EventDatetimeIso' }
                        isFavorited: { type: boolean }
                  total: { type: integer }

  /events/search:
    get:
      tags: [events]
      summary: 搜尋活動
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: 搜尋結果

  /events/trending:
    get:
      tags: [events]
      summary: 熱門活動
      responses:
        '200':
          description: 熱門活動列表

  /events/{id}:
    get:
      tags: [events]
      summary: 取得單一活動詳情
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 活動詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoffeeEvent' }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Event not found', code: EVENT_NOT_FOUND }
    put:
      tags: [events]
      summary: 編輯活動
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEventData' }
      responses:
        '200': { description: 更新後的活動 }
        '400':
          description: >-
            reservation.startAt 有值但 reservation.url 未填（錯誤訊息掛在
            reservation.url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                {
                  error: '請填寫預約網址，或清空預約日期／時間',
                  code: VALIDATION_ERROR,
                  field: reservation.url,
                }
        '403':
          description: 非本人投稿、非已認領主辦，也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足', code: EVENT_EDIT_FORBIDDEN }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在', code: EVENT_NOT_FOUND }
    delete:
      tags: [events]
      summary: 刪除活動
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 刪除成功 }
        '403':
          description: 非本人投稿、非已認領主辦，也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足', code: EVENT_DELETE_FORBIDDEN }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在', code: EVENT_NOT_FOUND }

  /events/{id}/view:
    post:
      tags: [events]
      summary: 紀錄一次瀏覽（有 rate limit）
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '204': { description: 紀錄成功（含去重命中） }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Event not found', code: EVENT_NOT_FOUND }
        '429':
          description: 超過 rate limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /events/{id}/resubmit:
    patch:
      tags: [events]
      summary: 重新送審（被拒絕後修改再送出）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 送審成功 }
        '403':
          description: 非本人投稿，只有創建者可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足: 只能重新送審自己的投稿', code: EVENT_RESUBMIT_FORBIDDEN }
        '404':
          description: 找不到活動
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在', code: EVENT_NOT_FOUND }
        '409':
          description: 活動目前狀態不是 rejected，只有被拒絕的活動可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '只能重新送審已拒絕的活動', code: EVENT_RESUBMIT_INVALID_STATE }

  /events/batch-review:
    post:
      tags: [events]
      summary: 批次審核活動（僅 admin）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [eventId, status]
                    properties:
                      eventId: { type: string }
                      status: { type: string, enum: [approved, rejected] }
                      reason:
                        type: string
                        description: 拒絕原因；status 為 rejected 時使用
      responses:
        '200':
          description: 審核完成
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CoffeeEvent' }
        '400':
          description: updates 為空、超過 50 筆，或元素缺少 eventId／status、status 不是合法值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                { error: 'updates 不能為空', code: VALIDATION_ERROR, field: updates }
        '404':
          description: 其中一筆活動不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '活動不存在: abc123', code: EVENT_NOT_FOUND }
        '500':
          description: 批次審核失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Internal server error, code: INTERNAL_ERROR }

  /venues:
    get:
      tags: [venues]
      summary: 取得場地列表
      parameters:
        - in: query
          name: region
          description: >-
            單一地區可傳字串（?region=台北），多個地區則重複 key（?region=台北&region=新北）
            由 Express 解析為陣列；接受「臺」字形並正規化為「台」；不合法地區回 400。
          schema:
            oneOf:
              - $ref: '#/components/schemas/VenueRegion'
              - { type: array, items: { $ref: '#/components/schemas/VenueRegion' } }
        - in: query
          name: capacityRange
          schema: { type: string, enum: [20以下, 20-40, 40-60, 60以上] }
        - in: query
          name: search
          description: >-
            場地名稱模糊比對：去除名稱與關鍵字的空白/標點後轉小寫比對（substring），
            如 abcmart 會比對到 ABC Mart、scoups 會比對到 S.Coups。
            與 region/capacityRange 為交集；空字串或未帶時不套用。
          schema: { type: string }
        - in: query
          name: sort
          description: >-
            未帶時等同 composite（綜合排序：活躍週數 50% + 瀏覽數 30% + 新場地加分 20%，
            同分依 createdAt desc 再依 id asc 排序）。sort=eventCount 明確指定時維持既有的
            eventCount desc 排序，行為不變。
          schema:
            {
              type: string,
              enum: [composite, eventCount, name, newest, random],
              default: composite,
            }
        - in: query
          name: limit
          description: >-
            一般（非 random）查詢為每頁筆數，預設 20，不設上限；
            sort=random 時為必填的抽樣數量，且不套用 page。
          schema: { type: integer, minimum: 1 }
        - in: query
          name: page
          description: >-
            僅用於一般（非 sort=random）查詢；非正整數（含缺少、0、負數、非數字字串）
            時 fallback 為 1，不報錯；超過 totalPages 時回傳空陣列。
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: 場地列表
          content:
            application/json:
              schema:
                type: object
                required: [venues]
                properties:
                  venues:
                    type: array
                    items: { $ref: '#/components/schemas/Venue' }
                  pagination:
                    description: 僅一般（非 sort=random）查詢會回傳此欄位
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
        '400':
          description: sort 或 limit 參數組合不合法
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                {
                  error: 'limit is required when sort is "random"',
                  code: VALIDATION_ERROR,
                  field: limit,
                }
    post:
      tags: [venues]
      summary: 新增場地（僅 admin）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVenueData' }
      responses:
        '201': { description: 建立成功 }

  /venues/{id}:
    get:
      tags: [venues]
      summary: 取得單一場地詳情（含關聯活動）
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 場地詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
    patch:
      tags: [venues]
      summary: 編輯場地（僅 admin）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 更新成功 }
    delete:
      tags: [venues]
      summary: 刪除場地（僅 admin）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 刪除成功 }

  /venues/{id}/view:
    post:
      tags: [venues]
      summary: 紀錄一次瀏覽（有 rate limit）
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '204': { description: 紀錄成功（含去重命中） }
        '404':
          description: 找不到場地
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Venue not found', code: VENUE_NOT_FOUND }
        '429':
          description: 超過 rate limit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venues/batch-review:
    patch:
      tags: [venues]
      summary: 批次審核場地（僅 admin，最多 50 筆）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                updates:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      venueId: { type: string }
                      status: { type: string, enum: [active, rejected] }
      responses:
        '200': { description: 審核完成 }

  /venues/batch-status:
    patch:
      tags: [venues]
      summary: 批次更新場地狀態（僅 admin，最多 50 筆）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 更新完成 }

  /venue-submissions:
    post:
      tags: [venues]
      summary: 公開場地投稿（建立為 pending）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVenueData' }
      responses:
        '201':
          description: 投稿建立成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
        '400':
          description: 輸入格式錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '場地名稱不能為空', code: VALIDATION_ERROR, field: name }
        '429':
          description: 每 IP 每 60 分鐘最多 5 次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venue-submissions/images:
    post:
      tags: [venues]
      summary: 公開場地投稿圖片上傳
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG、PNG 或 WebP，最大 5MB
      responses:
        '200': { description: 上傳成功 }
        '400':
          description: 格式、大小或欄位錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '圖片大小不能超過 5MB', code: VALIDATION_ERROR, field: file }
        '429':
          description: 每 IP 每 15 分鐘最多 60 次成功上傳
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venue-submissions/places/autocomplete:
    post:
      tags: [venues]
      summary: 公開場地投稿 Places 搜尋
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input: { type: string }
      responses:
        '200': { description: Places 預測結果 }
        '429':
          description: 每 IP 每 15 分鐘最多 300 次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /venue-submissions/places/{placeId}:
    get:
      tags: [venues]
      summary: 公開場地投稿 Place detail
      parameters:
        - name: placeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Place detail }
        '429':
          description: 每 IP 每 15 分鐘最多 300 次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                {
                  error: 'Too many requests, please try again later',
                  code: RATE_LIMITED,
                }

  /artists:
    get:
      tags: [artists]
      summary: 取得藝人列表
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [approved, pending, rejected] }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: sortBy
          schema: { type: string, enum: [stageName, coffeeEventCount, createdAt, birthday] }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
      responses:
        '200':
          description: 藝人列表
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artist' }
        '403':
          description: 帶 createdBy 查詢他人投稿，且非本人也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Permission denied', code: FORBIDDEN }
    post:
      tags: [artists]
      summary: 新增藝人投稿
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateArtistData' }
      responses:
        '201': { description: 建立成功 }
        '400':
          description: 缺少必填欄位或格式錯誤（見 artistSchemas.create）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '藝名為必填欄位', code: VALIDATION_ERROR, field: stageName }

  /artists/top:
    get:
      tags: [artists]
      summary: 熱門藝人排行
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: 熱門藝人列表 }
        '400':
          description: limit 非數字或小於 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: 'Invalid limit parameter', code: VALIDATION_ERROR, field: limit }

  /artists/{id}:
    get:
      tags: [artists]
      summary: 取得單一藝人詳情
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200':
          description: 藝人詳情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Artist not found', code: ARTIST_NOT_FOUND }
    put:
      tags: [artists]
      summary: 編輯藝人資料
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 更新成功 }
        '400':
          description: 格式錯誤（見 artistSchemas.update，所有欄位皆為 optional）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example: { error: '生日格式錯誤', code: VALIDATION_ERROR, field: birthday }
        '403':
          description: 非本人投稿也非 admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足', code: ARTIST_EDIT_FORBIDDEN }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在', code: ARTIST_NOT_FOUND }
    delete:
      tags: [artists]
      summary: 刪除藝人（僅 admin）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 刪除成功 }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在', code: ARTIST_NOT_FOUND }
        '409':
          description: 該藝人仍有關聯的生咖活動，不能刪除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '不能刪除已經有生咖活動的藝人', code: ARTIST_HAS_EVENTS }

  /artists/{id}/resubmit:
    patch:
      tags: [artists]
      summary: 重新送審
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/idPath'
      responses:
        '200': { description: 送審成功 }
        '403':
          description: 非本人投稿，只有創建者可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '權限不足: 只能重新送審自己的投稿', code: ARTIST_RESUBMIT_FORBIDDEN }
        '404':
          description: 找不到藝人
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在', code: ARTIST_NOT_FOUND }
        '409':
          description: 藝人目前狀態不是 rejected，只有被拒絕的藝人可以重新送審
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                { error: '只能重新送審已拒絕的藝人', code: ARTIST_RESUBMIT_INVALID_STATE }

  /artists/batch-review:
    post:
      tags: [artists]
      summary: 批次審核藝人（僅 admin）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [artistId, status]
                    properties:
                      artistId: { type: string }
                      status: { type: string, enum: [approved, rejected, exists] }
                      reason:
                        type: string
                        description: 拒絕原因；status 為 rejected 時使用
                      groupNames:
                        type: array
                        items: { type: string }
                        description: 審核通過時可一併更新團名
      responses:
        '200':
          description: 審核完成
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artist' }
        '400':
          description: updates 為空、超過 50 筆，或元素缺少 artistId／status、status 不是合法值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
              example:
                { error: 'updates 不能為空', code: VALIDATION_ERROR, field: updates }
        '404':
          description: 其中一筆藝人不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '藝人不存在: abc123', code: ARTIST_NOT_FOUND }
        '500':
          description: 批次審核失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Internal server error, code: INTERNAL_ERROR }

components:
  parameters:
    idPath:
      name: id
      in: path
      required: true
      schema: { type: string }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Firebase ID Token，帶在 `Authorization: Bearer {token}`'

  schemas:
    Error:
      type: object
      description: >-
        統一錯誤回應格式（見 src/utils/AppError.ts 與全域錯誤處理 middleware）。
      required: [error, code]
      properties:
        error: { type: string, description: 人類可讀的錯誤訊息 }
        code:
          type: string
          description: >-
            機器可讀的錯誤代碼，例如 EVENT_NOT_FOUND、ARTIST_NOT_FOUND、VENUE_NOT_FOUND、
            FORBIDDEN、VALIDATION_ERROR、SERVICE_UNAVAILABLE、RATE_LIMITED、
            ROUTE_NOT_FOUND、INTERNAL_ERROR 等，實際值請以拋出的 AppError 為準。

    ValidationError:
      description: VALIDATION_ERROR 的回應（400），部分情境會額外帶 field。
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            field:
              type: string
              description: 驗證失敗的欄位名稱（optional，並非所有 VALIDATION_ERROR 都會帶此欄位）

    FirestoreTimestamp:
      type: object
      description: >-
        Firestore Timestamp 物件（非 ISO 字串）。多數 events 端點（詳情、建立、更新、搜尋、熱門、
        收藏）一律是這個形狀；例外見 EventDatetimeIso。
      required: [_seconds, _nanoseconds]
      properties:
        _seconds: { type: integer }
        _nanoseconds: { type: integer }

    EventDatetimeIso:
      type: object
      description: >-
        ISO 8601 字串形式的 datetime（非 FirestoreTimestamp）。僅 GET /events 與
        GET /events/map-data 這兩個列表端點的回應使用此格式；其餘 events 端點仍回傳
        FirestoreTimestamp。GET /events 不論帶什麼 status（approved/pending/rejected/all）
        或 createdBy 查詢參數，datetime 一律是這個格式，並非只有公開（approved）列表才如此。
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    CoffeeEvent:
      type: object
      properties:
        id: { type: string }
        slug: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        artists:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              profileImage: { type: string }
        location:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
            venueId: { type: string }
        datetime:
          type: object
          properties:
            start: { $ref: '#/components/schemas/FirestoreTimestamp' }
            end: { $ref: '#/components/schemas/FirestoreTimestamp' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          description: 選填。舊活動（投稿於此欄位上線前）沒有此欄位，前端視為未填寫即可。
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectedReason: { type: string }
        viewCount: { type: integer }

    PublicEventListItem:
      type: object
      description: >-
        GET /events 回應中的活動項目。欄位與 CoffeeEvent 相同，但 datetime 為 EventDatetimeIso
        （ISO 8601 字串），不是 FirestoreTimestamp；不論查詢帶的 status（approved/pending/
        rejected/all）或 createdBy 為何皆是如此，不限於公開（approved）列表。
        不繼承 CoffeeEvent（allOf 疊加無法正確覆寫 datetime 的形狀——CoffeeEvent.datetime
        要求 FirestoreTimestamp，會與這裡的 EventDatetimeIso 互斥而永遠驗證失敗），改為完整
        重新定義。
      properties:
        id: { type: string }
        slug: { type: string, nullable: true }
        title: { type: string }
        description: { type: string }
        artists:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              profileImage: { type: string }
        location:
          type: object
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
            venueId: { type: string }
        datetime: { $ref: '#/components/schemas/EventDatetimeIso' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          description: 選填。舊活動（投稿於此欄位上線前）沒有此欄位，前端視為未填寫即可。
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }
        status: { type: string, enum: [pending, approved, rejected] }
        rejectedReason: { type: string }
        viewCount: { type: integer }

    CreateEventData:
      type: object
      required: [artistIds, title, location, datetime]
      properties:
        artistIds: { type: array, items: { type: string } }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location:
          type: object
          required: [name, coordinates]
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
        datetime:
          type: object
          properties:
            start: { $ref: '#/components/schemas/FirestoreTimestamp' }
            end: { $ref: '#/components/schemas/FirestoreTimestamp' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          description: '選填。url 需以 http:// 或 https:// 開頭；startAt 有值時 url 必填（否則 400）。'
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }

    UpdateEventData:
      type: object
      description: >-
        欄位與 CreateEventData 相同但皆為選填（局部更新，未傳入的欄位不變動既有值）。
        不繼承 CreateEventData（allOf 疊加覆寫在部分 validator 下無法正確表達
        reservation 的 nullable 語意），改為完整重新定義。
      properties:
        artistIds: { type: array, items: { type: string } }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location:
          type: object
          required: [name, coordinates]
          properties:
            name: { type: string }
            address: { type: string }
            city: { type: string }
            coordinates:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
            placeId: { type: string }
        datetime:
          type: object
          properties:
            start: { $ref: '#/components/schemas/FirestoreTimestamp' }
            end: { $ref: '#/components/schemas/FirestoreTimestamp' }
        socialMedia:
          type: object
          properties:
            instagram: { type: string }
            x: { type: string }
            threads: { type: string }
        mainImage: { type: string }
        detailImage: { type: array, items: { type: string } }
        reservation:
          type: object
          nullable: true
          description: 傳入 null 或 {} 代表清除既有預約資訊；省略此欄位則不變動既有值。
          properties:
            url: { type: string, description: '需以 http:// 或 https:// 開頭' }
            startAt: { $ref: '#/components/schemas/FirestoreTimestamp' }

    VenueRegion:
      type: string
      enum:
        [
          台北,
          新北,
          桃園,
          台中,
          台南,
          高雄,
          基隆,
          新竹,
          嘉義,
          宜蘭,
          苗栗,
          彰化,
          南投,
          雲林,
          屏東,
          花蓮,
          台東,
          澎湖,
          金門,
          連江,
        ]
      description: 與 src/middleware/validation.ts 的 venueRegionEnum 一致；「臺」字形會先正規化為「台」再比對。

    Venue:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        region: { $ref: '#/components/schemas/VenueRegion' }
        lat: { type: number }
        lng: { type: number }
        nearestMrt: { type: string }
        mrtWalkMinutes: { type: integer, nullable: true }
        capacityRange: { type: string, nullable: true }
        eventCount: { type: integer }
        viewCount: { type: integer }
        coverPhoto: { type: string }
        otherPhotos: { type: array, items: { type: string } }
        description: { type: string }
        hostTags: { type: array, items: { type: string } }
        status: { type: string }
        socialMedia:
          type: object
          properties:
            threads: { type: string }
            instagram: { type: string }
            line: { type: string }

    VenueDetail:
      allOf:
        - $ref: '#/components/schemas/Venue'
        - type: object
          properties:
            events:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  artistName: { type: string }
                  startDate: { type: string }
                  endDate: { type: string }
                  coverImage: { type: string }
                  slug: { type: string, nullable: true }

    CreateVenueData:
      type: object
      required: [name, address, region, capacityRange, coverPhoto, preferredContact, socialMedia]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 500 }
        region: { type: string }
        lat: { type: number }
        lng: { type: number }
        placeId: { type: string }
        nearestMrt: { type: string }
        mrtWalkMinutes: { type: integer, nullable: true }
        capacityRange: { type: string, enum: [20以下, 20-40, 40-60, 60以上] }
        description: { type: string }
        hostTags: { type: array, maxItems: 5, items: { type: string } }
        preferredContact: { type: string, enum: [instagram, threads, line, form, other] }
        contactUrl: { type: string, format: uri }
        coverPhoto: { type: string, format: uri }
        otherPhotos: { type: array, maxItems: 9, items: { type: string, format: uri } }
        socialMedia:
          type: object
          description: Instagram 或 Threads 至少一個非空；Line 可保留但不能單獨滿足建立條件
          anyOf:
            - required: [instagram]
            - required: [threads]
          properties:
            threads: { type: string, minLength: 1 }
            instagram: { type: string, minLength: 1 }
            line: { type: string }

    Artist:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        stageName: { type: string }
        stageNameZh: { type: string }
        groupNames: { type: array, items: { type: string }, maxItems: 5 }
        realName: { type: string }
        birthday: { type: string, format: date }
        profileImage: { type: string }
        status: { type: string, enum: [pending, approved, rejected, exists] }
        rejectedReason: { type: string }
        activeEventIds: { type: array, items: { type: string } }

    CreateArtistData:
      type: object
      required: [stageName]
      properties:
        stageName: { type: string, maxLength: 100 }
        stageNameZh: { type: string, maxLength: 100 }
        groupNames: { type: array, items: { type: string }, maxItems: 5 }
        realName: { type: string, maxLength: 100 }
        birthday:
          {
            type: string,
            pattern: '^\d{4}-\d{2}-\d{2}$',
            description: '格式正確但日曆上不存在的日期（如 2026-02-31）會回 400「生日日期不存在」',
          }
        profileImage: { type: string, format: uri }
